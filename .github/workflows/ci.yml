name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install and verify Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor-profiles apparmor-utils
          # Ubuntu 24.04 otherwise withholds Bubblewrap's network-namespace
          # setup capability. This packaged profile drops it again for children.
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          /usr/bin/bwrap \
            --die-with-parent \
            --new-session \
            --unshare-user \
            --unshare-ipc \
            --unshare-pid \
            --unshare-net \
            --unshare-uts \
            --unshare-cgroup-try \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            -- /bin/true

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint installer
        if: runner.os == 'Linux'
        run: shellcheck install.sh

      - name: Lint all targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test all targets
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

  windows-boundary:
    name: windows boundary
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Test constrained hard-link boundary
        run: cargo test --locked constrained_writers_reject_hard_links_to_protected_metadata
